# 正式迁移时替换现有 sites-available/default 的候选配置。
# 不能与原 default 同时启用；不匹配 oss.imzhanghao.com。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name imzhanghao.com www.imzhanghao.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location ^~ /ssl/ {
        return 404;
    }

    # 原有 GoAccess 报告继续使用原域名，避免迁站改变运维页面。
    location = /report.html {
        return 301 https://imzhanghao.com/report.html$is_args$args;
    }

    location / {
        add_header Cache-Control "max-age=300" always;
        return 301 https://v2grad.com$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name imzhanghao.com www.imzhanghao.com;

    ssl_certificate /etc/nginx/ssl/imzhanghao.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/imzhanghao.com/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:OldBlogSSL:1m;
    ssl_session_timeout 10m;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location ^~ /ssl/ {
        return 404;
    }

    location = /report.html {
        alias /data/www/goaccess/html/report.html;
    }

    location / {
        add_header Cache-Control "max-age=300" always;
        return 301 https://v2grad.com$request_uri;
    }
}
