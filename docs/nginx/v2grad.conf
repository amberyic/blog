# 待上线配置，不会被本地 Hexo 构建加载。
# 服务器使用前先准备网站目录及证书，放入 sites-available 后另行启用。
server {
    listen 80;
    listen [::]:80;
    server_name v2grad.com www.v2grad.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "max-age=300" always;
        return 301 https://v2grad.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.v2grad.com;

    ssl_certificate /etc/nginx/ssl/v2grad.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/v2grad.com/privkey.pem;
    ssl_protocols TLSv1.2;

    add_header Cache-Control "max-age=300" always;
    return 301 https://v2grad.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v2grad.com;

    ssl_certificate /etc/nginx/ssl/v2grad.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/v2grad.com/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:V2GradSSL:1m;
    ssl_session_timeout 10m;

    root /var/www/v2grad/current;
    index index.html;
    access_log /var/log/nginx/v2grad.access.log;
    error_log /var/log/nginx/v2grad.error.log;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 证书材料不通过网站提供，即便产物中误带同名目录。
    location ^~ /ssl/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
